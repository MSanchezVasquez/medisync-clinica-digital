name: CI Clínica Digital (Monorepo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_simulate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js y pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g pnpm

      - name: Instalar dependencias (Backend)
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma (Backend)
        working-directory: ./backend
        run: pnpm prisma generate

      - name: Verificar tipos (Backend)
        working-directory: ./backend
        run: pnpm run check

      - name: Ejecutar pruebas (Backend)
        working-directory: ./backend
        run: pnpm test

      - name: Compilar API (Backend)
        working-directory: ./backend
        run: pnpm run build

      - name: Instalar dependencias (Frontend)
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar React (Frontend)
        working-directory: ./frontend
        run: pnpm run build

      - name: Despliegue simulado a Staging
        run: |
          echo "==========================================="
          echo "Compilación de Backend y Frontend superada."
          echo "Empaquetando artefactos para producción..."
          echo "Desplegando en el entorno de Staging simulado..."
          echo "Flujo automatizado CI/CD exitoso."
          echo "==========================================="
